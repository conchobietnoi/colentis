<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colentis · Album sách 3D (mockup)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#15123B;--bg2:#201C52;--ink:#F1F0FF;--soft:#A7A9E6;--line:#363078;--pink:#FF2E88;--sky:#4CC9FF;--butter:#FFE45E;--violet:#7B61FF;--amber:#FFB02E;--mint:#35D0A5;
--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--pw:clamp(128px,40vw,300px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#2B2670 0%,var(--bg) 60%);padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto}
h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.2px}
.sub{font-size:12px;color:var(--soft);margin-top:2px}
.chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}

/* ===== KỆ SÁCH ===== */
.shelf{position:relative;max-width:760px;margin:clamp(40px,14vh,130px) auto 0;padding-bottom:22px}
.row{display:flex;justify-content:center;gap:clamp(18px,6vw,56px);align-items:flex-end;padding:0 8px 18px;position:relative;perspective:1100px;min-height:260px;padding-bottom:30px}
.plank{position:absolute;left:-4px;right:-4px;bottom:0;height:22px;border-radius:6px;background:linear-gradient(#4a3f9e,#2a2470 55%,#1c1856);box-shadow:0 14px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.18)}
.bk3{--w:clamp(104px,26vw,150px);--h:calc(var(--w)*.6667);--d:calc(var(--w)*.13);position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;transform:rotateY(32deg) rotateX(-4deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;padding:0;background:none;color:inherit;font:inherit;margin-bottom:6px;outline-offset:10px}
.bk3.tilt{transition:transform .12s linear}
.bk3 .fc{position:absolute;inset:0;border-radius:3px 7px 7px 3px;overflow:hidden}
.bk3 .front{transform:translateZ(calc(var(--d)/2))}
.bk3 .back{transform:translateZ(calc(var(--d)/-2)) rotateY(180deg);background:var(--c1)}
.bk3 .spine{position:absolute;top:0;width:var(--d);height:var(--h);left:calc((var(--w) - var(--d))/2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.1) 18%,rgba(0,0,0,.18));background-color:var(--c1);display:flex;align-items:center;justify-content:center;border-radius:2px}
.bk3 .spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:800;letter-spacing:.12em;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bk3 .edge{position:absolute;top:0;width:var(--d);height:var(--h);left:calc((var(--w) - var(--d))/2);transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:repeating-linear-gradient(90deg,#f6f6f2 0 1.5px,#d8d8d2 1.5px 3px)}
.bk3 .tp{position:absolute;width:var(--w);height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(90deg) translateZ(calc(var(--h)/2));background:repeating-linear-gradient(0deg,#f6f6f2 0 1.5px,#d8d8d2 1.5px 3px)}
.bk3 .bt{position:absolute;width:var(--w);height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#d8d8d2}
.bk3 .shadow{position:absolute;left:-8%;right:-30%;bottom:-18px;height:22px;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);transform:translateZ(calc(var(--d)/-2)) rotateX(90deg) translateZ(-1px);filter:blur(3px);pointer-events:none}
.slot{position:relative;z-index:2;padding-bottom:4px}
.lbl{position:absolute;left:-20px;right:-20px;top:100%;margin-top:-2px;text-align:center;font-size:12px;font-weight:700;color:var(--soft);pointer-events:none}
.hint{max-width:760px;margin:52px auto 0;text-align:center;font-size:12px;color:var(--soft)}

/* kệ một cuốn + khoá */
.row{min-height:300px}
.bk3{--w:clamp(200px,58vw,290px)}
.slot{display:flex;flex-direction:column;align-items:center}
.slot.lk .bk3{filter:saturate(.55) brightness(.78)}
.padl{position:absolute;left:50%;top:38%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(21,18,59,.86);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;color:var(--butter);z-index:3;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.padl .i{width:30px;height:30px}
.slot.unl .padl{animation:padFly .9s ease forwards}
@keyframes padFly{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.25) rotate(-14deg)}100%{transform:translateY(-120px) scale(.3) rotate(40deg);opacity:0}}
.slot.unl .bk3{animation:pop .9s ease}
@keyframes pop{0%{filter:saturate(.55) brightness(.78)}40%{filter:saturate(1.4) brightness(1.5) drop-shadow(0 0 28px #FFE45E)}100%{filter:none}}
.slot.shake .bk3{animation:shk .45s}
@keyframes shk{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-5px}80%{translate:5px}}
.prog{margin-top:44px;font-size:12px;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:8px}
.prog i{display:block;width:92px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.prog i b{display:block;height:100%;background:var(--butter);border-radius:9px}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:4;animation:spk 1s ease-out forwards}
@keyframes spk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(10,8,34,.6)}
.modal.on{display:flex;animation:fadeIn .25s both}
.msheet{width:min(460px,100%);background:var(--bg2);border:1.5px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom))}
.msheet h2{margin:0 0 4px;font-size:18px}.msheet p{margin:0 0 12px;font-size:13px;color:var(--soft);line-height:1.5}
.cd{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);font-size:13.5px;font-weight:700}
.cd:first-of-type{border-top:0}.cd .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--line);color:var(--soft);flex:none}
.cd.ok .ck{background:var(--mint);color:#1E1B5E}.cd.ok{color:var(--ink)}.cd:not(.ok){color:var(--soft)}
/* bìa mẫu (thay bằng ảnh bìa thật) */
.cover{position:absolute;inset:0;overflow:hidden;background:#cfd9e4}
.cover .art.real,.ph.real{background-size:cover;background-position:center}
.ph.real::before,.ph.real::after{display:none}
.cover .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover::before{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(90% 50% at 20% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(100deg,rgba(0,0,0,.28) 0 4%,rgba(255,255,255,.14) 5% 6%,transparent 8%)}
.cover .lab{position:absolute;right:0;bottom:0;width:41%;background:#8ED1D8;padding:3.2% 4% 3%;z-index:3;color:#0d0d0d}
.cover .lab i{display:block;font-style:normal;font-weight:900;font-size:clamp(10px,2.3vw,17px);letter-spacing:-.045em;line-height:1;white-space:nowrap}
.cover .lab em{display:block;margin-top:2px;font:500 clamp(3px,.74vw,5.6px)/1.1 ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap;font-style:normal}
.cover .gloss{position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.26) 48%,transparent 60%);transform:translateX(-120%);animation:gl 5s ease-in-out infinite}
@keyframes gl{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}

/* ===== TRÌNH ĐỌC ===== */
.reader{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(100% 70% at 50% 40%,#2B2670,#0d0b2a 80%);padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
.reader.on{display:flex;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35;cursor:default}
.stage{perspective:2200px;perspective-origin:50% 40%;width:calc(var(--pw)*2);height:calc(var(--pw)*.6667);position:relative;touch-action:pan-y}
.book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.2,1);transform:translateX(-25%) rotateX(8deg)}
.under{position:absolute;top:2px;bottom:2px;background:repeating-linear-gradient(90deg,#f1eefb 0 1.5px,#cdc8e6 1.5px 3px);border-radius:2px;transition:width .5s}
.under.r{left:50%;transform:translateZ(-2px)}
.under.l{right:50%;transform:translateZ(-2px)}
.board{position:absolute;top:-6px;bottom:-6px;width:calc(50% + 6px);background:var(--c1,#3b2fa0);border-radius:3px;box-shadow:0 30px 50px rgba(0,0,0,.55);transform:translateZ(-5px)}
.board.r{left:50%;border-radius:2px 8px 8px 2px}
.board.l{right:50%;border-radius:8px 2px 2px 8px}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;cursor:grab}
.leaf.drag{cursor:grabbing}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fbfaff;color:#1E1B5E}
.face.back{transform:rotateY(180deg)}
.face.f{border-radius:0 6px 6px 0}.face.back{border-radius:6px 0 0 6px}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.face.f .shade{background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 60%)}
.face.back .shade{background:linear-gradient(270deg,rgba(0,0,0,.45),transparent 60%)}
.face.f::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.04) 7%,transparent 14%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.2),rgba(0,0,0,.04) 7%,transparent 14%)}
.pgno{display:none;position:absolute;bottom:7px;font-size:10px;font-weight:700;color:#8d8fc0}
.face.f .pgno{right:12px}.face.back .pgno{left:12px}
.endpaper{background:linear-gradient(135deg,#4a9aa7,#2E7C8A);display:flex;align-items:center;justify-content:center;color:rgba(13,13,13,.6);font-weight:900;letter-spacing:.3em;font-size:13px}

/* dải trang khi đang lật */
.st{backface-visibility:visible}
.sf,.sb{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f6f6f2}
.sb{transform:rotateY(180deg)}
.sface{position:absolute;inset:0}
.ss{position:absolute;inset:0;pointer-events:none}

/* bố cục trang mẫu */
.face{background:#f6f6f2}
.pg.tt,.pg.cr{align-items:center;justify-content:center;text-align:center;color:#1f5b66;padding:0}
.pg.tt b{font-size:clamp(9px,2.4vw,15px);letter-spacing:-.04em;font-weight:900;transform:rotate(-8deg)}
.pg.tt small{font:500 clamp(4px,.9vw,6px) ui-monospace,monospace;margin-top:4px;color:#3d8795}
.pg.cr{gap:6px}.pg.cr b{letter-spacing:.3em;font-size:clamp(8px,1.8vw,11px)}.pg.cr p{margin:0;font-size:clamp(5.5px,1.2vw,8px);line-height:1.5;font-weight:600}.pg.cr p.s{opacity:.55}
.pg{position:absolute;inset:0;padding:9% 9% 12%;display:flex;flex-direction:column;gap:6%}
.ph{flex:1;border-radius:4px;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 2px 8px rgba(30,27,94,.25)}
.ph::after{content:'ẢNH ' attr(data-n) ' / 20';position:absolute;right:8px;bottom:6px;font-size:11px;font-weight:800;color:rgba(255,255,255,.85)}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 20%,rgba(255,255,255,.35),transparent 70%)}
.pol{background:#fff;padding:7% 7% 18%;box-shadow:0 4px 14px rgba(30,27,94,.3);transform:rotate(-2.5deg);flex:1;display:flex}
.pol .ph{box-shadow:none}
.cap{font-size:11px;font-weight:600;color:#5B5F9E;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6%;flex:1}
.full{padding:0}.full .ph{border-radius:0;box-shadow:none}

.ctrl{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px}
.cnt{font-size:12px;font-weight:700;color:var(--soft);min-width:96px;text-align:center}
.tip{position:absolute;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 52px);font-size:12px;color:var(--soft);transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.book,.bk3,.cover .gloss{transition:none;animation:none}.reader.on{animation:none}}
</style>
</head>
<body>
<div class="top">
  <div><h1>Album của mình</h1><div class="sub">Bộ sưu tập › Album · bản mockup, ảnh mẫu</div></div>
  <span class="chip">1 cuốn</span>
</div>

<div class="shelf">
  <div class="row" id="row"><div class="plank"></div></div>
  <div class="hint">Chạm vào sách để mở · rê hoặc nghiêng điện thoại để xoay</div>
</div>

<div class="modal" id="lockM" role="dialog" aria-modal="true"><div class="msheet"><h2>Album còn đang khoá</h2><p>Hoàn thành các điều kiện của Mùa Concept để mở cuốn album.</p><div id="conds"></div><button class="btn" id="tryUnlock" style="width:100%;margin-top:12px;background:var(--pink);border-color:var(--pink);color:#fff;min-height:46px">Mở khoá thử (chỉ có ở mockup)</button><button class="btn" id="lockX" style="width:100%;margin-top:8px;min-height:44px">Đóng</button></div></div>
<div class="reader" id="reader" aria-modal="true" role="dialog">
  <div class="rbar">
    <button class="btn" id="close">← Về kệ</button>
    <div style="display:flex;gap:8px"><button class="btn" id="snd" aria-pressed="true">♪ Tiếng giấy</button></div>
  </div>
  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="board l"></div><div class="board r"></div>
      <div class="under l" id="uL"></div><div class="under r" id="uR"></div>
    </div>
  </div>
  <div class="tip" id="tip">Kéo mép trang hoặc chạm hai bên để lật</div>
  <div class="ctrl">
    <button class="btn" id="prev">‹ Trước</button>
    <span class="cnt" id="cnt"></span>
    <button class="btn" id="next">Sau ›</button>
  </div>
</div>

<script>
(function(){
const BOOKS=[
 {t:'GREENGREEN · STREET',n:'GREEN<br>GREEN',c1:'#2E7C8A',c2:'#5BB5C2',sub:'STREET ver.',p:11}
];
/* điều kiện mở sách (mockup: bấm "Mở khoá thử" để xem hiệu ứng) */
const CONDS=[['Gom đủ concept Urichinguchana',true],['Gom đủ concept Aniyaaa',true],['Gom đủ concept Poyoyoi',false]];
let UNLOCKED=false;
const PAL=[['#0f2a44','#2f78b8'],['#13384f','#5bb5c2'],['#1b2a4a','#3d6fb0'],['#0b1c33','#2a8fa8'],['#274b6e','#8fd0d8'],['#162b3d','#3a7ca0'],['#2c3e57','#6aa9c9'],['#0e2438','#2f9aa5']];
const $=s=>document.querySelector(s), row=$('#row');
/* ảnh thật (bìa trước, bìa sau, 20 trang) do trang nạp vào window.ALBUM_IMAGES = {cover, back, pages:[...]} từ bucket riêng tư; không có thì dùng hình mẫu */
const IMGS=window.ALBUM_IMAGES||null;
const realImg=u=>`<div class="art real" style="background-image:url('${u}')"></div>`;
const coverHTML=b=>`<div class="cover" style="--c1:${b.c1};--c2:${b.c2}">${IMGS&&IMGS.cover?realImg(IMGS.cover):`<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" class="art"><rect width="120" height="90" fill="#dcd6ca"/><rect y="0" width="120" height="22" fill="#e7e3da"/><rect y="20" width="120" height="3" fill="#bdb7aa"/><g fill="#f4f5f6"><rect x="20" y="13" width="30" height="9" rx="3"/><rect x="78" y="12" width="28" height="9" rx="3"/></g><rect x="53" y="13" width="22" height="9" rx="3" fill="#6b7d96"/><rect y="23" width="120" height="40" fill="#4a5b78"/><path d="M0 24h120" stroke="#8d9ab0" stroke-width=".6"/><path d="M0 34 L46 62 L46 90 L0 90Z" fill="#c2c5c8"/><path d="M0 34 L46 62 L46 66 L0 38Z" fill="#f0f1f2"/><g fill="#2c6b46"><path d="M12 30 L8 14 L14 26 L16 12 L18 27 L24 15 L20 31Z"/></g><path d="M30 60 H120 V90 H46Z" fill="#59688a"/><rect x="66" y="40" width="18" height="12" rx="4" fill="#27423a"/><ellipse cx="78" cy="30" rx="6.5" ry="8" fill="#d6ad8e"/><path d="M71 28 q7-10 14 0 v-3 q-7-8-14 0z" fill="#1c1c24"/><path d="M60 52 q4-10 26-9 l8 22 H62z" fill="#1d2a45"/><ellipse cx="102" cy="30" rx="7" ry="8.5" fill="#d9b394"/><path d="M92 32 q0-14 10-14 q10 0 10 14 l-3 22 H95z" fill="#1d3fa6"/><path d="M95 24 q7-9 14 0 l2 8 h-18z" fill="#1d3fa6"/><ellipse cx="46" cy="36" rx="6" ry="7.6" fill="#d6ad8e"/><path d="M40 33 q6-9 12 0 l1 3 h-14z" fill="#2a2018"/><path d="M36 44 h20 l-2 18 H38z" fill="#f2f2f0"/><ellipse cx="12" cy="45" rx="6" ry="7.6" fill="#d8b092"/><path d="M6 43 q6-9 12 0 l1 3 h-14z" fill="#4a3322"/><path d="M0 52 q10-4 28-1 l4 14 H0z" fill="#59b5b0"/><path d="M14 64 L92 60 L112 66 L116 74 L96 80 L24 78Z" fill="#3f7fb8"/><path d="M24 78 L96 80 L116 74 L120 90 H20Z" fill="#33699f"/><path d="M80 62 q18-4 38 6 l-2 8 q-20-8-38-6z" fill="#2c5f93"/><ellipse cx="22" cy="69" rx="8" ry="9" fill="#d6ad8e"/><path d="M13 66 q8-12 18-3 l-2 6 q-8-4-14 2z" fill="#4a3022"/><path d="M26 74 q14-6 40-4 l4 12 q-26-4-40 2z" fill="#4a5f82"/></svg>`}<div class="lab"><i>GREEN<wbr>GREEN</i><em>34.09035° N, 118.34873° W</em></div><span class="gloss"></span></div>`;

/* ---- kệ sách ---- */
BOOKS.forEach((b,i)=>{
  const el=document.createElement('button');el.className='bk3';el.setAttribute('aria-label','Mở '+b.t);
  el.style.setProperty('--c1',b.c1);
  el.innerHTML=`<div class="fc front">${coverHTML(b)}</div><div class="fc back">${IMGS&&IMGS.back?realImg(IMGS.back):''}</div>
   <div class="spine"><span>CORTIS · GREENGREEN</span></div><div class="edge"></div><div class="tp"></div><div class="bt"></div><div class="shadow"></div>`;
  el.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.classList.add('tilt');el.style.transform=`rotateY(${18-x*34}deg) rotateX(${-4-y*18}deg) translateY(-6px)`});
  el.addEventListener('pointerleave',()=>{el.classList.remove('tilt');el.style.transform=''});
  el.addEventListener('click',()=>{if(UNLOCKED)openBook(i);else{const sl=el.closest('.slot');sl.classList.remove('shake');void sl.offsetWidth;sl.classList.add('shake');showLock()}});
  const slot=document.createElement('div');slot.className='slot';slot.appendChild(el);slot.classList.add('lk');slot.insertAdjacentHTML('beforeend',`<span class="padl" id="padl">${'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'}</span><div class="lbl">${b.t}</div><div class="prog" id="prog"></div>`);row.insertBefore(slot,row.querySelector('.plank'));
});
/* nghiêng theo con quay (nếu có) */
addEventListener('deviceorientation',e=>{if(e.gamma==null||$('#reader').classList.contains('on'))return;const g=Math.max(-25,Math.min(25,e.gamma));document.querySelectorAll('.bk3:not(:hover)').forEach(el=>{el.style.transform=`rotateY(${32-g*.8}deg) rotateX(-4deg)`})},{passive:true});

/* ---- khoá / mở khoá ---- */
function refreshLock(){
  const have=CONDS.filter(c=>c[1]).length,pr=$('#prog');
  if(pr)pr.innerHTML=UNLOCKED?'<span style="color:var(--mint)">Đã mở khoá · chạm để đọc</span>':`Mở khoá ${have}/${CONDS.length}<i><b style="width:${have/CONDS.length*100}%"></b></i>`;
  const cd=$('#conds');if(cd)cd.innerHTML=CONDS.map(c=>`<div class="cd ${c[1]?'ok':''}"><span class="ck">${c[1]?'✓':''}</span>${c[0]}</div>`).join('');
}
function showLock(){refreshLock();$('#lockM').classList.add('on')}
$('#lockX').onclick=()=>$('#lockM').classList.remove('on');
$('#lockM').addEventListener('click',e=>{if(e.target.id==='lockM')$('#lockM').classList.remove('on')});
$('#tryUnlock').onclick=()=>{
  $('#lockM').classList.remove('on');
  CONDS.forEach(c=>c[1]=true);UNLOCKED=true;refreshLock();
  const sl=document.querySelector('.slot');sl.classList.add('unl');hiss();
  const r=sl.getBoundingClientRect(),cx=r.width/2,cy=r.height*.4;
  for(let i=0;i<26&&!reduce;i++){const e=document.createElement('i');e.className='spark';const a=Math.random()*6.28,d=60+Math.random()*110;
    e.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${['#FFE45E','#FF2E88','#4CC9FF','#35D0A5'][i%4]};animation-delay:${Math.random()*.15}s`;sl.appendChild(e);setTimeout(()=>e.remove(),1300)}
  setTimeout(()=>{sl.classList.remove('lk','unl');const pd=sl.querySelector('.padl');if(pd)pd.remove()},900);
};
refreshLock();
/* ---- trình đọc ---- */
const book=$('#book'),reader=$('#reader'),uL=$('#uL'),uR=$('#uR');
let leaves=[],N=0,cur=0,busy=0,cfg=null,snd=true,ac=null;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function photo(n,k){if(IMGS&&IMGS.pages&&IMGS.pages[n-1])return `<div class="ph real" style="background-image:url('${IMGS.pages[n-1]}')"></div>`;const p=PAL[(n+k)%PAL.length];return `<div class="ph" data-n="${n}" style="--a:${p[0]};--b:${p[1]}"></div>`}
function page(n){ /* n = số trang; 2 = trang tên, 3–22 = 20 ảnh STREET (ngang 3:2, tràn trang), 25 = credit */
  if(n===2)return `<div class="pg tt"><b>GREENGREEN</b><small>34.09035° N, 118.34873° W</small></div>`;
  if(n>=3&&n<=22)return `<div class="pg full">${photo(n-2,n)}</div>`;
  if(n===23)return `<div class="pg cr"><b>CORTIS</b><p>2nd Mini Album<br>GREENGREEN<br>STREET ver.</p><p class="s">Credit · lời bài hát · thông tin<br>(chữ in nhỏ như bản thật)</p></div>`;
  return `<div class="pg"></div>`;
}
function leafHTML(i,b){
  const front=i===0?`<div class="face f" style="background:none;border-radius:2px 8px 8px 2px">${coverHTML(b)}<div class="shade"></div></div>`
    :`<div class="face f">${page(2*i)}<span class="pgno">${2*i}</span><div class="shade"></div></div>`;
  const back=i===0?`<div class="face back endpaper">CORTIS<div class="shade"></div></div>`
    :`<div class="face back">${page(2*i+1)}<span class="pgno">${2*i+1}</span><div class="shade"></div></div>`;
  return front+back;
}
function openBook(idx){
  cfg=BOOKS[idx];N=cfg.p+1;cur=0;
  reader.style.setProperty('--c1',cfg.c1);
  book.querySelectorAll('.leaf').forEach(l=>l.remove());
  leaves=[];
  for(let i=0;i<N;i++){const l=document.createElement('div');l.className='leaf';l.innerHTML=leafHTML(i,cfg);book.appendChild(l);leaves.push(l);bindDrag(l,i)}
  book.querySelectorAll('.board').forEach(x=>x.style.background=cfg.c1);
  book.style.transition='none';book.style.transform='translateX(-25%) rotateX(8deg) scale(.6)';
  reader.classList.add('on');render(true);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{book.style.transition='';layout()}));
  $('#tip').style.opacity=1;setTimeout(()=>$('#tip').style.opacity=0,4200);
}
function layout(){
  const t=cur===0?'translateX(-25%)':cur===N?'translateX(25%)':'translateX(0)';
  book.style.transform=`${t} rotateX(8deg)`;
}
/* ===== lật trang cong: mỗi trang đang lật tách thành NS dải nối khớp, góc từng dải lệch dần theo tiến độ ===== */
const NS=40;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const TH=3; /* độ dày mỗi tờ trên chồng giấy (px) */
function bendAt(t){ /* góc lệch tương đối mỗi dải (độ): <0 mép ngoài đi trước (lúc nhấc), >0 mép ngoài trễ (lúc hạ) */
  const s=Math.sin(Math.PI*t);return s*(6.5*(2*t-1)+2.2);
}
function enterStrip(l){
  if(l._st)return;
  const W=l.offsetWidth,sw=W/NS,fr=l.querySelector('.face.f'),bk=l.querySelector('.face.back');
  l._orig=l.innerHTML;
  const clean=(face,back)=>{const c=face.cloneNode(true);c.querySelectorAll('.shade,.pgno').forEach(x=>x.remove());c.classList.remove('f','back');c.classList.add('sface');c.style.transform='none';c.style.backfaceVisibility='visible';c.style.webkitBackfaceVisibility='visible';return c};
  const fC=clean(fr),bC=clean(bk);
  l.innerHTML='';l._st=[];
  let parent=l;
  for(let i=0;i<NS;i++){
    const st=document.createElement('div');st.className='st';
    st.style.cssText=`position:absolute;top:0;height:100%;left:${i?sw-0.0:0}px;width:${sw+2.2}px;transform-origin:left center;transform-style:preserve-3d`;
    if(!i)st.style.left='0px';
    const sf=document.createElement('div'),sb=document.createElement('div');
    sf.className='sf';sb.className='sb';
    const fi=document.createElement('div'),bi=document.createElement('div');
    fi.className=bi.className='sin';
    fi.style.cssText=`position:absolute;top:0;left:${-i*sw}px;width:${W}px;height:100%`;
    bi.style.cssText=`position:absolute;top:0;left:${-(W-(i+1)*sw)}px;width:${W}px;height:100%`;
    fi.appendChild(fC.cloneNode(true));bi.appendChild(bC.cloneNode(true));
    const fs=document.createElement('i'),bs=document.createElement('i');fs.className=bs.className='ss';
    sf.append(fi,fs);sb.append(bi,bs);st.append(sf,sb);
    parent.appendChild(st);st._fs=fs;st._bs=bs;l._st.push(st);parent=st;
  }
}
function exitStrip(l){if(!l._st)return;l.innerHTML=l._orig;l._st=null}
function setT(i,t){ /* t: 0 = nằm bên phải, 1 = đã lật sang trái */
  const l=leaves[i];l._t=t;
  l.style.transform=`rotateY(${-180*t}deg)`;
  if(!l._st){castOff();return}
  const b=bendAt(t),sn=Math.sin(Math.PI*t);let acc=-180*t;const ang=[];
  l._st.forEach((st,k)=>{
    const sp=k/(NS-1);
    /* độ cong dồn về mép ngoài + gợn sóng nhẹ của tờ giấy */
    const rel=k?(b*.75*Math.pow(sp,1.6)+sn*.34*Math.sin(k*.85+t*11)*sp):0;
    acc+=rel;ang.push(acc);
    st.style.transform=k?`rotateY(${rel}deg)`:'none';
  });
  const dk=a=>Math.min(.36,(1-Math.abs(Math.cos((a+28)*Math.PI/180)))*.5);
  const sp=a=>{const c=Math.cos((a+62)*Math.PI/180);return c>0?Math.pow(c,14)*.22:0}; /* vệt sáng bóng */
  let tip=0;
  l._st.forEach((st,k)=>{
    const a0=k?(ang[k-1]+ang[k])/2:ang[0],a1=k<NS-1?(ang[k]+ang[k+1])/2:ang[k];
    const d0=dk(a0).toFixed(3),d1=dk(a1).toFixed(3),s0=sp(a0).toFixed(3),s1=sp(a1).toFixed(3);
    const g=dir=>`linear-gradient(${dir},rgba(255,255,255,${s0}),rgba(255,255,255,${s1})),linear-gradient(${dir},rgba(5,14,26,${d0}),rgba(5,14,26,${d1}))`;
    st._fs.style.background=g('90deg');st._bs.style.background=g('270deg');
    tip+=Math.cos(ang[k]*Math.PI/180)/NS;
  });
  cast(l,tip,sn,t);
}
/* bóng trang đang lật đổ xuống trang bên dưới */
function castEl(){let c=book.querySelector('.cast');if(!c){c=document.createElement('div');c.className='cast';book.appendChild(c)}return c}
function castOff(){const c=book.querySelector('.cast');if(c)c.style.opacity=0}
function cast(l,tip,sn,t){
  const c=castEl(),W=l.offsetWidth,H=l.offsetHeight,half=book.offsetWidth/2;
  const x=half+tip*W, len=W*(.1+.32*sn);
  const a=Math.min(.42,sn*.5);
  /* bóng nằm ngoài mép trang: bên phải mép khi t<.5, bên trái khi t>.5 */
  const right=t<.5;
  c.style.cssText=`position:absolute;top:0;height:${H*1.03}px;left:${right?x:x-len}px;width:${len}px;pointer-events:none;opacity:${a};background:linear-gradient(${right?'90deg':'270deg'},rgba(4,10,20,.8),transparent);z-index:1;transform:translateZ(2px)`;
}
function zFinal(i){return i<cur?i+1:N-i}
function updateUI(){
  uL.style.width=(cur*TH)+'px';uR.style.width=((N-cur)*TH)+'px';
  book.querySelector('.board.l').style.opacity=cur===0?0:1;book.querySelector('.under.l').style.opacity=cur===0?0:1;
  $('#cnt').textContent=cur===0?'Bìa':cur===N?'Bìa sau':`Trang ${2*cur}–${2*cur+1} / ${2*N-1}`;
  $('#prev').disabled=cur===0;$('#next').disabled=cur===N;
  layout();
}
function render(){ /* đặt mọi trang về trạng thái nghỉ */
  leaves.forEach((l,i)=>{exitStrip(l);setT(i,i<cur?1:0);l.style.transition='none';l.style.zIndex=zFinal(i)});
  updateUI();
}
function animateLeaf(i,to,dur,done){
  const l=leaves[i];enterStrip(l);l.style.zIndex=100;
  const from=l._t,t0=performance.now();dur=reduce?0:dur*Math.max(.35,Math.abs(to-from));
  cancelAnimationFrame(l._raf);
  const step=now=>{
    const u=dur?Math.min(1,(now-t0)/dur):1;
    setT(i,from+(to-from)*ease(u));
    if(u<1)l._raf=requestAnimationFrame(step);
    else{setT(i,to);exitStrip(l);l.style.zIndex=zFinal(i);done&&done()}
  };
  l._raf=requestAnimationFrame(step);
}
window.__albScrub=(i,t)=>{const l=leaves[i];enterStrip(l);l.style.zIndex=100;setT(i,t)}; /* móc kiểm thử */
function go(dir){
  if(busy)return;const n=cur+dir;if(n<0||n>N)return;
  const i=dir>0?cur:cur-1;busy=1;cur=n;updateUI();hiss();
  animateLeaf(i,dir>0?1:0,1150,()=>{busy=0});
}
function bindDrag(l,i){
  let sx=0,p=0,mode=0,moved=false;
  l.addEventListener('pointerdown',e=>{
    if(busy)return;const flipped=i<cur;
    if(!flipped&&i!==cur)return;if(flipped&&i!==cur-1)return;
    mode=flipped?-1:1;sx=e.clientX;p=0;moved=false;l.setPointerCapture(e.pointerId);
  });
  l.addEventListener('pointermove',e=>{
    if(!mode)return;
    const w=l.offsetWidth||200,span=Math.max(w*1.5,120);
    p=Math.max(0,Math.min(1,mode*(sx-e.clientX)/span));
    if(p>.02&&!moved){moved=true;enterStrip(l);l.style.zIndex=100}
    if(moved)setT(i,mode>0?p:1-p);
  });
  const end=e=>{
    if(!mode)return;const m=mode;mode=0;
    if(!moved){go(m);return}
    busy=1;
    if(p>.3){cur+=m;updateUI();hiss();animateLeaf(i,m>0?1:0,800,()=>{busy=0})}
    else animateLeaf(i,m>0?0:1,500,()=>{busy=0});
  };
  l.addEventListener('pointerup',end);l.addEventListener('pointercancel',end);
}
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
$('#close').onclick=()=>{reader.classList.remove('on')};
addEventListener('keydown',e=>{if(!reader.classList.contains('on'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')reader.classList.remove('on')});
$('#snd').onclick=e=>{snd=!snd;e.currentTarget.setAttribute('aria-pressed',snd);e.currentTarget.style.opacity=snd?1:.5};

/* tiếng giấy: nhiễu lọc ngắn, chỉ phát sau khi người dùng chạm */
function hiss(){
  if(!snd||reduce)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*.28,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*(1-t*.4)}
    const s=ac.createBufferSource();s.buffer=buf;
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.7;
    const g=ac.createGain();g.gain.value=.12;
    s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  }catch(_){}
}
})();
</script>
