<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colentis · mockup v2</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--sleeve:#E6E9FF;--paper:#F7F8FF;--ink:#1E1B5E;--soft:#5B5F9E;--line:#C9CEF5;--pink:#FF2E88;--sky:#4CC9FF;--butter:#FFE45E;--mint:#35D0A5;--violet:#7B61FF;--amber:#FFB02E;
--cf:#C9CEF5;--cn:#1E1B5E;--wk:#5B5F9E;--mo:#1E1B5E;--cal-bg:var(--sleeve);--shadow:0 10px 30px rgba(30,27,94,.16);--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
--rc-common:#8D94B8;--rc-rare:#2F8CFF;--rc-legend:#9B5CFF;--rc-supreme:#FF2E88;--rc-event:#FFB02E;--logo:none}
.dk{--sleeve:#15123B;--paper:#201C52;--ink:#F1F0FF;--soft:#A7A9E6;--line:#363078;--cf:#363078;--cn:#F1F0FF;--wk:#A7A9E6;--mo:#F1F0FF;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 15% 0,#d9d4ff,transparent),radial-gradient(900px 700px at 100% 100%,#ffd1ea,transparent),#cfd3f8;font-family:var(--font);color:#1E1B5E;overflow-x:hidden}
body.pdark{background:radial-gradient(900px 600px at 15% 0,#2a2468,transparent),radial-gradient(900px 700px at 100% 100%,#4a1c58,transparent),#0f0d2b}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.stagewrap{min-height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px;flex-wrap:wrap}
.panel{width:290px;color:#1E1B5E;display:flex;flex-direction:column;gap:10px}
body.pdark .panel{color:#F1F0FF}
.panel h1{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.panel p{font-size:12.5px;line-height:1.5;opacity:.8}
.panel h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;opacity:.7}
.panel .grp{display:flex;flex-wrap:wrap;gap:6px}
.panel button{background:#1E1B5E;color:#fff;border-radius:99px;padding:7px 12px;font-weight:700;font-size:12px}
body.pdark .panel button{background:#F1F0FF;color:#1E1B5E}
.panel button.on{background:var(--pink);color:#fff}
.demofab{display:none}
.phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:640px;background:var(--sleeve);color:var(--ink);border-radius:38px;overflow:hidden;position:relative;box-shadow:0 0 0 9px #14123F,0 30px 60px rgba(20,18,63,.4);display:flex;flex-direction:column;isolation:isolate;transition:background .3s}
.sb{height:38px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:13px;font-weight:700;position:relative;z-index:3}
.sb span{display:flex;gap:5px;align-items:center}
.sb .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3.5px;position:relative}.sb .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.offline-pill{position:absolute;top:40px;left:50%;transform:translate(-50%,-80px);background:#1E1B5E;color:#FFE45E;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;z-index:40;display:flex;gap:7px;align-items:center;transition:transform .35s cubic-bezier(.2,.9,.3,1);white-space:nowrap}
.offline-pill.on{transform:translate(-50%,0)}.dk .offline-pill{background:#FFE45E;color:#1E1B5E}
.scr{display:none;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:20px;position:relative;animation:scrin .3s ease both}
.scr::-webkit-scrollbar{display:none}.scr.on{display:block}
@keyframes scrin{from{opacity:0;transform:translateY(8px)}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px 18px;background:var(--paper);border-top:1.5px solid var(--line);flex:none;position:relative;z-index:4}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--soft);position:relative;padding:3px 0}
.tabs svg{width:24px;height:24px;transition:transform .2s}
.tabs .on{color:var(--pink);font-weight:800}.tabs .on svg{transform:translateY(-2px) scale(1.08)}
.tabs .on::before{content:"";position:absolute;top:-8px;width:22px;height:3px;border-radius:9px;background:var(--pink)}
.dot-n{position:absolute;top:-2px;right:calc(50% - 20px);background:var(--pink);color:#fff;font-size:9.5px;font-weight:900;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--paper)}
h1,h2,h3{font-weight:900}
.head{padding:4px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.head small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:2px;cursor:pointer}
.head h1{font-size:34px;line-height:1.02;letter-spacing:-1.2px;color:var(--mo);white-space:nowrap}
.head .mnav h1{font-size:30px}
.hact{display:flex;gap:8px;align-items:center}
.ibtn{position:relative;width:40px;height:40px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;font-size:19px;color:var(--ink);transition:transform .15s}
.ibtn:active{transform:scale(.9)}.ibtn .dot-n{top:-6px;right:-6px}
.ibtn.ring::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid var(--pink);opacity:0;animation:ripple 2s ease-out infinite}
@keyframes ripple{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.streak{background:var(--ink);color:var(--butter);font-weight:900;font-size:13px;padding:7px 11px;border-radius:13px;transform:rotate(3deg);display:flex;gap:5px;align-items:center;white-space:nowrap}
.dk .streak{background:var(--butter);color:#1E1B5E}.streak.wait{background:var(--amber);color:#1E1B5E}
.mnav{display:flex;align-items:center;gap:6px}.mnav .ibtn{width:32px;height:32px;border-radius:11px;font-size:15px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px}
.dow{font-size:10.5px;font-weight:800;color:var(--wk);text-align:center;padding-bottom:5px}
.c{aspect-ratio:3/4;border-radius:9px;background:var(--paper);border:1.5px solid var(--cf);color:var(--cn);position:relative;font-size:11.5px;font-weight:800;padding:4px 0 0 5px;overflow:hidden;cursor:pointer;transition:transform .15s;display:block;text-align:left}
.c:active{transform:scale(.92)}
.c.e{visibility:hidden;pointer-events:none}
.c .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c .cv~b{position:relative;z-index:2;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.c.gp{border-color:transparent}
.c .st{position:absolute;right:3px;bottom:3px;width:17px;height:23px;border-radius:4px;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(20,18,63,.45);overflow:hidden;transform:rotate(5deg);z-index:2;background:linear-gradient(160deg,var(--ca,#7B61FF),var(--cb,#FF7AB8))}
.c .st img{width:100%;height:100%;object-fit:cover;display:block}
.c .lk{position:absolute;right:3px;top:3px;font-size:10px;z-index:3;opacity:.95;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.c:not(.gp) .lk{color:var(--soft);filter:none}
.c .gm{position:absolute;left:4px;bottom:4px;z-index:3;font-size:11px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.c.today{border:2.5px solid var(--pink);color:var(--pink)}
.c.today::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,46,136,.3)}
.c.sel{outline:3px solid var(--sky);outline-offset:1px}
.c.fut{font-weight:600}
.c .dots{position:absolute;left:5px;bottom:5px;display:flex;gap:3px}.c .dots i{width:6px;height:6px;border-radius:50%}
.c.sv{background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--line) 5px 7px);border-style:solid}
.c.sv .ic{position:absolute;right:4px;bottom:4px;color:var(--soft);font-size:15px}
.c.em{border-style:dashed;color:var(--soft);font-weight:600}
.c.em .ic{position:absolute;right:5px;bottom:4px;color:var(--soft);font-size:11px;font-weight:700}
.c.ms{background:repeating-linear-gradient(135deg,rgba(255,176,46,.22) 0 5px,rgba(255,176,46,.05) 5px 9px),var(--paper);border-color:var(--amber);color:var(--ink)}
.c.ms .ic{position:absolute;right:4px;bottom:4px;color:#d98400;font-size:14px;animation:tick 2s steps(2) infinite}
@keyframes tick{50%{opacity:.4}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 16px 0;font-size:10.5px;color:var(--soft);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:15px;border-radius:3px;display:block;border:1.5px solid var(--line)}
.card-b{margin:12px 14px 0;background:var(--paper);border-radius:20px;padding:14px;border:1.5px solid var(--line)}
.card-b h2{font-size:15px;display:flex;justify-content:space-between;align-items:center}.card-b h2 em{font-style:normal;color:var(--pink)}
.banner{margin:10px 14px 0;border-radius:20px;padding:13px 14px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;text-align:left;width:calc(100% - 28px);cursor:pointer}
.banner b{display:block;font-size:14px;font-weight:900;line-height:1.25}.banner small{font-size:11.5px;font-weight:600;opacity:.85;display:block;margin-top:2px;line-height:1.35}
.banner .bi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.banner.ev{background:linear-gradient(120deg,#2b1a63,#7a2dbd 55%,#ff5db6);color:#fff;box-shadow:0 8px 24px rgba(122,45,189,.35)}
.banner.ev .bi{background:rgba(255,255,255,.18)}
.banner.ev::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 3.6s infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.banner.warn{background:rgba(255,176,46,.18);border:1.5px solid var(--amber);color:var(--ink)}
.banner.warn .bi{background:var(--amber);color:#1E1B5E}
.btnrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn-s{padding:8px 13px;border-radius:99px;font-weight:800;font-size:12px;background:var(--ink);color:var(--paper);display:inline-flex;gap:6px;align-items:center}
.btn-s.ghost{background:none;border:2px solid var(--line);color:var(--soft)}.btn-s.pink{background:var(--pink);color:#fff}
.t{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);font-size:14px;font-weight:600;position:relative}
.t:first-of-type{border-top:0}
.t .ck{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--ink);flex:none;position:relative;transition:.2s;cursor:pointer;background:none}
.t.d .ck{background:var(--ink);transform:scale(1.05)}
.t.d .ck::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--butter);border-width:0 3px 3px 0;transform:rotate(40deg)}
.dk .t.d .ck{background:var(--butter);border-color:var(--butter)}.dk .t.d .ck::after{border-color:#1E1B5E}
.t.d .tt{color:var(--soft);text-decoration:line-through}
.t.lockd .ck{opacity:.5;cursor:default}
.t.oth .ck{border-color:var(--line);cursor:default;border-radius:50%}.t.oth.d .ck{background:var(--line);border-color:var(--line)}.t.oth.d .ck::after{border-color:var(--soft)}
.t .tt{flex:1;min-width:0;line-height:1.3}.t small{display:block;font-size:11px;font-weight:600;color:var(--soft)}
.lbl{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.mem{width:22px;height:22px;border-radius:50%;flex:none;font-size:10px;font-weight:900;color:#1E1B5E;display:grid;place-items:center;border:2px solid var(--paper)}
.t .ed{color:var(--soft);font-size:16px;padding:4px}
.fab{position:absolute;right:16px;bottom:88px;width:56px;height:56px;border-radius:20px;background:var(--pink);color:#fff;font-size:26px;box-shadow:0 8px 20px rgba(255,46,136,.45);transform:rotate(-6deg);z-index:5;display:grid;place-items:center;transition:transform .2s}
.fab:active{transform:rotate(-6deg) scale(.9)}
.sk{background:linear-gradient(100deg,var(--line) 30%,var(--paper) 50%,var(--line) 70%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:9px}
@keyframes shim{to{background-position:-200% 0}}
/* sheets & pages */
.bd{position:absolute;inset:0;background:rgba(20,18,63,.55);opacity:0;pointer-events:none;transition:.25s;z-index:46;backdrop-filter:blur(2px)}.bd.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 18px 24px;z-index:47;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1);max-height:88%;overflow-y:auto;scrollbar-width:none;color:var(--ink)}
.sheet.on{transform:none}.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:21px;margin-bottom:2px}
.sub{font-size:12.5px;color:var(--soft);font-weight:600}
.in{width:100%;font:inherit;font-size:15px;font-weight:600;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--sleeve);color:var(--ink);margin:6px 0;outline:none}
.in:focus{border-color:var(--sky)}
.row{display:flex;gap:8px;align-items:center;margin:9px 0;flex-wrap:wrap;font-size:13px;font-weight:700}
.chip{padding:7px 13px;border-radius:99px;border:2px solid var(--line);background:none;color:var(--soft);font-weight:800;font-size:12px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dotc{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;flex:none}.dotc.on{border-color:var(--ink)}
.big{width:100%;background:var(--pink);color:#fff;font-weight:900;font-size:16px;padding:15px;border-radius:17px;margin-top:10px;box-shadow:0 8px 20px rgba(255,46,136,.3);display:flex;justify-content:center;gap:8px;align-items:center}
.big.alt{background:var(--ink);color:var(--paper);box-shadow:none}.big.gh{background:none;border:2px solid var(--line);color:var(--soft);box-shadow:none}
.big[disabled]{opacity:.45;pointer-events:none}
.tog{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}.tog.on{background:var(--pink)}.tog.on::after{left:23px}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:90;white-space:nowrap;pointer-events:none;max-width:90%;text-overflow:ellipsis;overflow:hidden}.toast.on{opacity:1;transform:translate(-50%,0)}
.page{position:absolute;inset:0;background:var(--sleeve);z-index:25;transform:translateX(104%);transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;color:var(--ink)}
.page.on{transform:none}
.ptop{display:flex;align-items:center;gap:8px;padding:44px 14px 6px;flex:none}
.ptop h1{font-size:22px;letter-spacing:-.5px;flex:1}
.pbody{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}.pbody::-webkit-scrollbar{display:none}
.lock-banner{display:flex;gap:10px;align-items:center;background:var(--sleeve);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--soft);margin:10px 0}
.lock-banner svg{font-size:18px;color:var(--ink)}
.cstrip{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none;align-items:flex-end}
.cstrip .pc{flex:none}
/* ====== avatar + title frames ====== */
.av{position:relative;width:var(--s,124px);height:var(--s,124px);flex:none}
.av .pt{position:absolute;left:14.84375%;top:14.84375%;width:70.3125%;height:70.3125%;border-radius:50%;background:linear-gradient(160deg,var(--ca,#9AA6FF),var(--cb,#4CC9FF));overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:900;font-size:calc(var(--s,124px)*.26)}
.av .pt img{width:100%;height:100%;object-fit:cover}
.av>img.fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.av.none::before{content:"";position:absolute;inset:6%;border-radius:50%;border:3px solid var(--line)}
.tf{position:relative;display:inline-block;height:var(--h,56px);aspect-ratio:var(--ar,3.8)}
.tf>img{position:absolute;inset:0;width:100%;height:100%}
.tf span{position:absolute;left:23.7%;right:23.7%;top:25%;height:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:calc(var(--h,56px)*.24);line-height:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.35);white-space:nowrap}
.tf.tn span{left:var(--l,23.7%);right:var(--l,23.7%)}
.tf.none{border:2px dashed var(--line);border-radius:14px;aspect-ratio:auto;padding:0 18px;display:flex;align-items:center;color:var(--soft);font-weight:700;font-size:12px}
.mini{width:46px;height:46px}
.ctr{text-align:center;padding:0 16px}
.ctr h1{font-size:25px;margin-top:2px}.ctr .un{font-size:13px;color:var(--soft);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stats div{background:var(--paper);border:1.5px solid var(--line);border-radius:15px;padding:10px 4px}.stats b{display:block;font-size:20px;font-weight:900}.stats small{font-size:10.5px;color:var(--soft);font-weight:700}
.menu{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;margin-top:8px;font-weight:700;font-size:14px;width:100%;color:var(--ink);text-align:left}
.menu small{display:block;font-size:11px;color:var(--soft);font-weight:600;margin-top:1px}
.menu .l{display:flex;gap:11px;align-items:center;min-width:0}.menu .l>svg{font-size:20px;color:var(--pink)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ach button{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:800;line-height:1.2;color:var(--ink);position:relative;min-height:112px}
.ach .av{--s:62px}.ach button.lk .av,.ach button.lk .tfw{filter:grayscale(1) opacity(.4)}
.ach button.lk{color:var(--soft)}.ach button.eq{border-color:var(--butter);box-shadow:0 0 0 2px var(--butter)}
.ach .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.rbar{display:flex;gap:6px;padding:0 14px}.rbar>div{flex:1;background:var(--paper);border:2px solid var(--rc);border-radius:13px;padding:7px 3px;text-align:center;font-size:10px;font-weight:800;color:var(--soft)}.rbar>div>b{display:block;font-size:14px;color:var(--ink)}
.rbar .bar{height:4px;border-radius:9px;background:var(--line);margin:5px 6px 0;overflow:hidden}.rbar .bar i{display:block;height:100%;background:var(--rc)}
.fl{display:flex;gap:6px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;font-weight:900;font-size:15px}.sec small{font-size:11.5px;color:var(--soft);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:8px 14px}
.slot{aspect-ratio:3/4;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .15s}.slot:active{transform:scale(.94)}
.slot .pc{--w:100%}
.slot.lk{cursor:default;border-radius:12px;border:2px dashed var(--line);background:var(--paper)}
.slot.lk::after{content:"";position:absolute;inset:0;background:var(--logo) center/46% no-repeat;opacity:.25;filter:invert(.2)}

.spl h1{margin-top:30px;font-size:30px;font-weight:900;letter-spacing:.34em;padding-left:.34em;background:linear-gradient(100deg,#fff 20%,#A5CDAB 38%,#fff 56%,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.spl .tip{margin-top:10px;font-size:13px;font-weight:600;color:#c9cdf7;height:20px;transition:opacity .25s}
.spl .bar{margin-top:22px;width:190px;height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.spl .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#A5CDAB,#FFE45E,#FF2E88)}
.spl .foot{position:absolute;bottom:34px;font-size:11px;color:#9a9dd9;letter-spacing:.08em}
/* auth */
.aut .hero{position:relative;width:100%;height:292px;flex:none;display:grid;place-items:center}
.aut .hero .fc{position:absolute;width:104px;aspect-ratio:3/4;border-radius:14px;border:3px solid #fff;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45);animation:fcf 5s ease-in-out infinite alternate}
.aut .hero .fc img{width:100%;height:100%;object-fit:cover}
.aut .hero .fc:nth-child(1){left:28px;top:70px;--r:-12deg;transform:rotate(-12deg)}
.aut .hero .fc:nth-child(2){right:26px;top:62px;--r:11deg;transform:rotate(11deg);animation-delay:-2s}
.aut .hero .fc:nth-child(3){left:50%;top:44px;margin-left:-62px;width:124px;--r:-2deg;z-index:2;transform:rotate(-2deg);animation-delay:-1s;border-color:#FFE45E}
@keyframes fcf{to{transform:translateY(-12px) rotate(calc(var(--r) + 3deg))}}
.aut .hero .brand{position:absolute;bottom:12px;left:0;right:0;text-align:center}
.aut .hero .brand b{display:block;font-size:26px;font-weight:900;letter-spacing:.28em;padding-left:.28em}
.aut .hero .brand span{font-size:12.5px;color:#c9cdf7;font-weight:600}
.aut .panel2{position:relative;flex:1;width:100%;background:var(--paper);color:var(--ink);border-radius:30px 30px 0 0;padding:18px 20px 22px;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.35);overflow-y:auto}
.iseg{display:grid;grid-template-columns:1fr 1fr;background:var(--sleeve);border-radius:15px;padding:4px;position:relative}
.iseg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--paper);border-radius:12px;box-shadow:0 3px 10px rgba(30,27,94,.18);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.iseg.r i{transform:translateX(100%)}
.iseg button{position:relative;z-index:1;padding:10px;font-weight:800;font-size:14px;color:var(--soft);transition:color .2s}.iseg button.on{color:var(--ink)}
.fld{position:relative;margin-top:12px}
.fld>svg.i{position:absolute;left:14px;top:25px;transform:translateY(-50%);color:var(--soft);font-size:18px}
.fld input{width:100%;padding:14px 44px 14px 42px;border-radius:15px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(123,97,255,.16)}
.fld.bad input{border-color:#ff4d6d;animation:shk .35s}
.fld .eye{position:absolute;right:8px;top:25px;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--soft);border-radius:10px}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err{font-size:12px;font-weight:700;color:#e0264f;margin:5px 4px 0;min-height:0}
.fld.x{overflow:hidden;max-height:0;margin:0;opacity:0;transition:.3s}.fld.x.on{max-height:90px;margin-top:12px;opacity:1;overflow:visible}
.forg{align-self:flex-end;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--violet)}
.igo{margin-top:16px;width:100%;padding:15px;border-radius:17px;background:var(--pink);color:#fff;font-size:16px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:9px;box-shadow:0 8px 20px rgba(255,46,136,.32);position:relative;overflow:hidden}
.igo::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:glint 3s infinite}
@keyframes glint{60%,100%{left:120%}}
.igo.ld{pointer-events:none;opacity:.9}.igo .sp{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 2px;font-size:12px;color:var(--soft);font-weight:700}.or::before,.or::after{content:"";height:1.5px;background:var(--line);flex:1}
.gg{margin-top:10px;width:100%;padding:13px;border-radius:17px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:14.5px;display:flex;justify-content:center;align-items:center;gap:10px;color:var(--ink)}
.gg b{width:20px;height:20px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);display:inline-block;-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.legal{margin-top:auto;padding-top:14px;text-align:center;font-size:11.5px;color:var(--soft);line-height:1.5}
/* chọn thành viên */
.pck{padding:46px 18px 20px;justify-content:flex-start}
.pck h2{font-size:24px;font-weight:900;text-align:center;line-height:1.2}
.pck .sb2{margin-top:6px;font-size:13px;color:#c9cdf7;text-align:center;max-width:310px;line-height:1.45}
.pck .stg{position:relative;margin-top:12px;width:100%;display:flex;flex-direction:column;align-items:center}
.pck .stg .glow{position:absolute;top:0;width:230px;height:230px;border-radius:50%;filter:blur(30px);opacity:.55;background:var(--gc,#7B61FF);transition:background .4s}
.pck .stg .av{position:relative;z-index:1}
.pck .stg .tf{position:relative;z-index:1;margin-top:-6px}
.pck .stg .tf.pop span{animation:tpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.pck .stg .who{position:relative;z-index:1;margin-top:8px;font-size:13px;font-weight:800;color:#c9cdf7;letter-spacing:.04em;height:18px}
.pck .stg .who b{color:#fff}
.pck .lst{width:100%;display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mrow{position:relative;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 10px;border-radius:17px;background:rgba(255,255,255,.08);border:2px solid transparent;text-align:left;color:#fff;transition:.25s;overflow:hidden}
.mrow .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:#14103f;background:var(--mc);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.mrow b{font-size:15.5px;flex:1}.mrow small{display:block;font-size:11.5px;color:#aeb2ea;font-weight:600;margin-top:1px}
.mrow .ck{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:14px;color:transparent;transition:.25s}
.mrow.on{background:rgba(255,255,255,.16);border-color:var(--mc);box-shadow:0 0 22px -4px var(--mc);transform:scale(1.02)}
.mrow.on .ck{background:var(--mc);border-color:var(--mc);color:#14103f;animation:tpop .4s}
.mrow.on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22),transparent 70%);transform:translateX(-120%);animation:swp .8s .05s}
@keyframes swp{to{transform:translateX(120%)}}
.pck .igo{margin-top:14px;margin-bottom:6px}.pck .igo[disabled]{opacity:.4;pointer-events:none;box-shadow:none}
.icf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.icf i{position:absolute;top:44%;left:50%;width:9px;height:14px;border-radius:2px;opacity:0;animation:icf 1.5s ease-out forwards}
@keyframes icf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media (max-height:760px){.aut .hero{height:230px}.aut .hero .fc{width:86px}.aut .hero .fc:nth-child(3){width:104px;margin-left:-52px}}
@media (prefers-reduced-motion:reduce){.spl .lg::before,.spl .orb,.spl .lg .mk,.intro .blobs i,.aut .hero .fc,.igo::after{animation:none}}
.reduce .spl .lg::before{animation-duration:3s}
.g:has(.gsum.on) #gskip{display:none}

.aut .hero{height:250px}.aut .hero .hmk{position:absolute;top:56px;left:50%;width:104px;height:104px;margin-left:-52px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 8px 22px rgba(165,205,171,.55));animation:mk 2.8s ease-in-out infinite}
.aut .hero .brand{bottom:22px}
@media (max-height:760px){.aut .hero{height:200px}.aut .hero .hmk{top:36px;width:84px;height:84px;margin-left:-42px}}

.aut .hero{height:270px;overflow:hidden;border-radius:0 0 30px 30px}
.aut .hero .hph{position:absolute;inset:0;background-size:cover;background-position:50% 30%;animation:hz 14s ease-in-out infinite alternate}
@keyframes hz{to{transform:scale(1.08)}}
.aut .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,63,.15) 0%,rgba(20,16,63,0) 35%,rgba(20,16,63,.78) 82%,rgba(20,16,63,.95) 100%)}
.aut .hero .brand{z-index:2;bottom:34px;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.aut .hero .brand span{color:#e4e6ff}
@media (max-height:760px){.aut .hero{height:210px}}
@media (prefers-reduced-motion:reduce){.aut .hero .hph{animation:none}}

/* ===== Quà Tân binh CORTIS: khung → chọn thành viên → thẻ cứu → xé gói → lật 5 thẻ ===== */
.wz{overflow:clip;position:absolute;inset:0;z-index:320;background:radial-gradient(120% 70% at 50% 18%,#3b2a9a 0%,#1d1550 48%,#0f0b33 100%);color:#fff;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .45s;display:none}
.wz.on{display:block;opacity:1;pointer-events:auto}
.wz.shk{animation:scrsh .4s linear infinite}
.wzst{position:absolute;inset:0;pointer-events:none}.wzst i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s ease-in-out infinite}
.wzdots{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:30}
.wzdots i{width:22px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);transition:.4s}.wzdots i.on{background:var(--butter);width:34px;box-shadow:0 0 12px var(--butter)}.wzdots i.dn{background:rgba(255,255,255,.7)}
.wzb{position:absolute;inset:0}
.wzs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:60px 20px 26px;animation:wzin .5s both}
@keyframes wzin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.wzs h2{font-size:25px;font-weight:900;text-align:center;line-height:1.15;position:relative;z-index:2}
.wzs>p{font-size:13px;color:#c9cdf7;text-align:center;margin-top:8px;line-height:1.5;max-width:310px;position:relative;z-index:2}
.wzbtn{margin-top:auto;position:relative;z-index:5;background:var(--butter);color:#1E1B5E;font-weight:900;font-size:16px;padding:15px 40px;border-radius:99px;display:flex;align-items:center;gap:9px;box-shadow:0 10px 26px rgba(255,228,94,.35);overflow:hidden;min-width:210px;justify-content:center}
.wzbtn[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
.wzbtn::after{content:"";position:absolute;top:0;bottom:0;width:50px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:glint 2.6s infinite}
.wzfl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}.wzfl.go{animation:wzfl .7s ease-out}
@keyframes wzfl{0%{opacity:.95}100%{opacity:0}}
.wzp{position:absolute;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.wzp i{position:absolute;border-radius:2px;opacity:0;animation:wzpa var(--d,1.2s) ease-out forwards}
@keyframes wzpa{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4)}}
/* bước 1: khung */
.s1 .rays{position:absolute;left:50%;top:238px;width:600px;height:600px;margin:-300px;background:repeating-conic-gradient(from 0deg,rgba(255,224,120,.26) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 14%,transparent 66%);mask:radial-gradient(circle,#000 14%,transparent 66%);animation:spin 26s linear infinite,wzin 1s both}
.s1 .fav{position:relative;margin-top:22px;z-index:2;animation:frin 1.1s cubic-bezier(.2,1.3,.4,1) .15s both}
@keyframes frin{0%{opacity:0;transform:scale(.1) rotate(-200deg)}100%{opacity:1;transform:none}}
.s1 .ftl{position:relative;z-index:2;margin:6px 0 20px;animation:ftin .8s cubic-bezier(.2,1.3,.4,1) .9s both}
@keyframes ftin{0%{opacity:0;transform:translateX(120px) scale(.6)}100%{opacity:1;transform:none}}
.s1 h2,.s1>p{animation:wzin .7s 1.3s both}
/* bước 2: chọn thành viên */
.s2{padding-top:54px}.s2 h2{font-size:23px}
.s2 .stg{position:relative;margin-top:8px;display:flex;flex-direction:column;align-items:center;width:100%}
.s2 .stg .glow{position:absolute;top:0;width:210px;height:210px;border-radius:50%;filter:blur(30px);opacity:.55;background:var(--gc,#7B61FF);transition:background .4s}
.s2 .stg .av{position:relative;z-index:1}
.s2 .stg .tf{position:relative;z-index:1;margin-top:-4px}
.s2 .stg .tf.mys span{animation:myst 1.6s ease-in-out infinite;letter-spacing:.3em}
@keyframes myst{50%{opacity:.35}}
.s2 .stg .tf.shake{animation:tshk .7s}
@keyframes tshk{10%,50%,90%{transform:translateX(-7px) rotate(-1.5deg)}30%,70%{transform:translateX(7px) rotate(1.5deg)}100%{transform:none}}
.s2 .stg .tf.rvl span{animation:tpop .6s cubic-bezier(.3,1.6,.5,1)}
.s2 .who{position:relative;z-index:1;margin-top:6px;font-size:12.5px;font-weight:800;color:#c9cdf7;min-height:18px;text-align:center}.s2 .who b{color:var(--butter)}
.s2 .lst{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.s2 .mrow{padding:8px 14px 8px 10px}.s2 .mrow b{font-size:15.5px}
.s2 .mrow.lock{pointer-events:none;opacity:.45}.s2 .mrow.lock.on{opacity:1}
/* bước 3: thẻ cứu */
.s3 .sbig{position:relative;margin-top:70px;width:190px;height:190px;display:grid;place-items:center}
.s3 .sbig::before,.s3 .sbig::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #4CC9FF;animation:wzring 2s ease-out infinite}.s3 .sbig::after{animation-delay:1s}
@keyframes wzring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.s3 .sh{width:150px;height:150px;border-radius:42px;display:grid;place-items:center;font-size:74px;background:linear-gradient(140deg,#1a8aa8,#4CC9FF);box-shadow:0 0 50px #4CC9FF,inset 0 0 0 4px rgba(255,255,255,.35);animation:shin .9s cubic-bezier(.2,1.4,.4,1) both;position:relative;z-index:2}
@keyframes shin{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.s3 .cnt{font-size:54px;font-weight:900;margin-top:14px;text-shadow:0 0 24px #4CC9FF;position:relative;z-index:2}
.s3 .cnt2{font-size:13px;color:#c9cdf7;margin-top:2px;font-weight:700}
/* bước 4: xé gói */
.s4 .wpk{position:absolute;left:50%;top:44%;width:212px;height:296px;margin:-148px 0 0 -106px;touch-action:none;animation:wzdrop .9s cubic-bezier(.3,1.35,.5,1) both}
@keyframes wzdrop{0%{transform:translateY(-640px) rotate(-14deg)}100%{transform:none}}
.wpk .fl{position:absolute;inset:0;animation:pfloat 3s ease-in-out .9s infinite}
.wpk .glow{position:absolute;left:-40px;right:-40px;top:-30px;bottom:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,228,94,.55),transparent 62%);opacity:var(--pg,.25);filter:blur(6px)}
.wpk .pbody,.wpk .ps{background:repeating-linear-gradient(45deg,#2B2470 0 8px,#3A2BCB 8px 16px)}
.wpk .pbody{position:absolute;left:0;right:0;top:60px;bottom:0;border-radius:0 0 20px 20px;border:4px solid #fff;border-top:0;overflow:hidden;box-shadow:0 0 36px rgba(122,104,255,.8)}
.wpk .pbody::before{content:"";position:absolute;inset:0;background:var(--logo) center 46%/58% no-repeat;opacity:.34;mix-blend-mode:screen}
.wpk .pbody::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 46%,transparent 60%);transform:translateX(-120%);animation:sweep 2.8s infinite}
.wpk .pbody .lb{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-weight:900;letter-spacing:.2em;font-size:12px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.wpk .ps{position:absolute;left:0;right:0;top:0;height:64px;border:4px solid #fff;border-bottom:3px dashed rgba(255,255,255,.85);border-radius:20px 20px 0 0;box-shadow:0 0 30px rgba(122,104,255,.8);transform-origin:0 100%}
.wpk .ps::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 50%,rgba(0,0,0,.25));border-radius:inherit}
.wpk .ps b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;font-weight:900;letter-spacing:.14em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.wpk .slit{position:absolute;left:4px;right:4px;top:48px;height:26px;background:linear-gradient(180deg,#fff,#ffe45e 55%,rgba(255,228,94,0));filter:blur(1px);box-shadow:0 -10px 24px #ffe45e}
.wpk .fng{position:absolute;left:14px;top:20px;width:42px;height:42px;font-size:30px;z-index:9;pointer-events:none;animation:fng 1.7s ease-in-out infinite}
@keyframes fng{0%{transform:translateX(0);opacity:0}15%{opacity:1}75%{transform:translateX(150px);opacity:1}100%{transform:translateX(160px);opacity:0}}
.s4 .hint{position:absolute;left:0;right:0;top:calc(44% + 178px);text-align:center;font-weight:800;font-size:14px;z-index:6}.s4 .hint small{display:block;font-size:11px;opacity:.65;font-weight:600;margin-top:3px}
.s4 .beam{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px;background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.5) 0 5deg,transparent 5deg 14deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);mask:radial-gradient(circle,#000 0%,transparent 62%);opacity:0;transform:scale(.2);pointer-events:none}
.s4 .beam.go{animation:wzbeam 1.3s ease-out forwards}
@keyframes wzbeam{0%{opacity:1;transform:scale(.2) rotate(0)}100%{opacity:0;transform:scale(1.4) rotate(40deg)}}
/* bước 5: lật từng thẻ */
.rv{padding:56px 0 0}.rv .wzhd{font-weight:900;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.9;z-index:6;text-align:center}.rv .wzhd small{display:block;text-transform:none;letter-spacing:.03em;font-weight:600;opacity:.7;font-size:12px;margin-top:3px}
.wzstack{position:absolute;left:50%;top:41%;width:0;height:0;z-index:8;transition:opacity .35s,transform .35s}.wzstack.away{opacity:0;transform:translateY(40px) scale(.92);pointer-events:none}
.wzstack .bk{position:absolute;transform:translate(-50%,-50%) translate(var(--ox,0),var(--oy,0)) rotate(var(--rt,0));animation:wzrise .7s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--dl,0s)}
@keyframes wzrise{0%{opacity:0;transform:translate(-50%,-50%) translateY(160px) scale(.6)}100%{opacity:1}}
.wzstack .bk.top{cursor:pointer;animation:wzrise .7s cubic-bezier(.2,1.2,.4,1) both,wzbob 2.2s ease-in-out .8s infinite}
@keyframes wzbob{50%{margin-top:-8px}}
.wzstack .bk.tell .pb{animation:tellp 1.4s ease-in-out infinite;border-color:var(--tc)}
@keyframes tellp{50%{box-shadow:0 0 38px 8px var(--tc),0 14px 40px rgba(0,0,0,.5)}}
.wzstack .bk.hide{visibility:hidden}
.wzcw{position:absolute;left:50%;top:41%;width:0;height:0;z-index:9;perspective:1100px}
.wzcw .tl{position:absolute;transform:translate(-50%,-50%) scale(.2);opacity:0}
.wzcw.show .tl{animation:cpop .7s cubic-bezier(.2,1.25,.4,1) forwards}
.wzcw .flipper{transform:rotateY(180deg)}.wzcw.rev .flipper{transform:none;transition:transform .9s cubic-bezier(.3,1.2,.4,1)}
.wzcw.out .tl{animation:wzout .5s cubic-bezier(.5,0,.8,.4) forwards}

function rollEvent(){const w={A:1,S:1,SS:1,SSS:1,AURA:.2905};const left=Object.keys(w),out=[];for(let k=0;k<2;k++){const tot=left.reduce((s,t)=>s+w[t],0);let x=Math.random()*tot,pick=left[0];for(const t of left){x-=w[t];if(x<=0){pick=t;break}}out.push(pick);left.splice(left.indexOf(pick),1)}return out.sort((a,b)=>['A','S','SS','SSS','AURA'].indexOf(a)-['A','S','SS','SSS','AURA'].indexOf(b))}

 return `<div class="cheer"><small>Bạn chưa xong việc, cổ vũ họ nhé</small><div>${os.map(o=>{const id=Object.keys(MEMBERS).find(k=>MEMBERS[k]===o.m);const sent=S.cheered[id];return `<button class="chip ${sent?'':'on'}" data-x="cheer" data-id="${id}" ${sent?'disabled':''}>${ic('heart')} ${sent?'Đã cổ vũ '+o.m.name:'Cổ vũ '+o.m.name}</button>`}).join('')}</div></div>`}
function cheerSheet(id){const m=MEMBERS[id];openSheet(`<h2>Cổ vũ ${m.name}</h2><div class="sub">${m.name} xong ${othersState().find(o=>o.m===m).d}/${othersState().find(o=>o.m===m).n} việc hôm nay. Mỗi người nhận 1 lời cổ vũ mỗi ngày từ bạn.</div>${CHEERS.map((c,i)=>`<button class="menu" data-x="cheerok" data-id="${id}" data-i="${i}"><span class="l">${ic(c[1])}<span>${c[0]}</span></span>${ic('send')}</button>`).join('')}<button class="big gh" data-x="cfno">Để sau</button>`)}
/* ===== mốc streak ===== */
const MILES=[3,7,14,30,60,100,365];
function showMile(n){const t=TMAP['streak-'+n];sfx('legend');vib([40,40,40,40,120]);const o=$('#mile');
 o.innerHTML=`<div class="mlbg"></div><div class="mlc"><div class="mlf">${ic('flame')}<i></i><i></i><i></i></div><small>CHUỖI LIÊN TIẾP</small><h2><b id="mln">0</b> ngày</h2><p>${n>=100?'Một trăm ngày không bỏ cuộc. Quá đỉnh!':n>=30?'Cả tháng liền! Bạn đang tạo thói quen thật sự.':n>=7?'Một tuần liền! Giữ nhịp này nhé.':'Ngọn lửa đầu tiên đã cháy.'}</p>
 ${t?`<div class="mlt"><small>Danh hiệu ${S.unlocked.has('streak-'+n)?'đã mở':'mới'}</small>${titleFrame('streak-'+n,null,58)}</div>`:''}
 <button class="big" data-x="mlx">Tiếp tục</button>${t?`<button class="big gh" data-x="mlt" data-n="${n}">Xem danh hiệu</button>`:''}</div><div class="confetti" id="mlcf"></div>`;o.classList.add('on');
 const cf=$('#mlcf');cf.innerHTML=Array.from({length:46},()=>`<i style="left:${R(0,100)}%;background:${pickOne(CONF)};--d:${R(2.4,4.4).toFixed(2)}s;--l:${R(0,2.2).toFixed(2)}s;transform:rotate(${R(0,360)}deg)"></i>`).join('');
 let v=0;const tm=setInterval(()=>{v=Math.min(n,v+Math.max(1,Math.ceil(n/28)));const e=$('#mln');if(!e){clearInterval(tm);return}e.textContent=v;if(v>=n)clearInterval(tm)},40)}
function mileCheck(){const n=S.streak;if(MILES.includes(n)&&!S.mileSeen[n]){S.mileSeen[n]=1;setTimeout(()=>showMile(n),500)}}
/* ===== hướng dẫn 3 trang ===== */
const TOUR=[
 {ic:'check',ic2:'gift',tone:'#FF2E88',t:'Tick xong, nhận thẻ',p:['Hoàn thành 100% việc của bạn trong ngày để nhận 1 ảnh cá nhân.','Khi cả nhóm cùng xong, bạn nhận thêm 1 ảnh nhóm.','Mỗi ngày tối đa 2 ảnh.']},
 {ic:'lock',ic2:'cal',tone:'#7B61FF',t:'Nhận ảnh thì ngày được khóa',p:['Trước khi nhận, Colentis luôn hỏi xác nhận để bạn không bị khóa bất ngờ.','Sau khi nhận, việc trong ngày chỉ để xem lại.','Ảnh bạn nhận hiện ngay trên ô ngày của lịch.']},
 {ic:'flame',ic2:'shield',tone:'#FFB02E',t:'Giữ chuỗi bằng tick bù và thẻ cứu',p:['Mỗi ngày làm ít nhất 1 việc thì chuỗi tăng thêm 1.','Lỡ một ngày: tick bù trong 48 giờ hoặc dùng thẻ cứu.','Thẻ cứu có tối đa 5 lần mỗi tháng. Thẻ cứu còn lại hiện trên Hôm nay.']}];
function openTour(){S.tourSeen=true;TOURI=0;const o=$('#tour');o.classList.add('on');renderTour()}
let TOURI=0;
function renderTour(){const t=TOUR[TOURI],last=TOURI===TOUR.length-1,o=$('#tour');
 o.innerHTML=`<div class="tc" style="--c:${t.tone}"><button class="tskip" data-x="tskip">${last?'':'Bỏ qua'}</button><div class="tart"><i></i><span class="a1">${ic(t.ic)}</span><span class="a2">${ic(t.ic2)}</span></div><h2>${t.t}</h2><ul>${t.p.map(x=>`<li>${x}</li>`).join('')}</ul><div class="tdots">${TOUR.map((_,i)=>`<i class="${i===TOURI?'on':''}"></i>`).join('')}</div><div class="tbtns">${TOURI?`<button class="big gh" data-x="tprev">Trước</button>`:''}<button class="big" data-x="tnext">${last?'Bắt đầu thôi':'Tiếp'}</button></div></div>`}
/* ===== ngày sinh người dùng: kiểm tra ===== */
function bdCheck(v){if(!v)return {ok:true,msg:''};const d=new Date(v+'T00:00:00');if(isNaN(d))return {ok:false,msg:'Ngày sinh chưa đúng'};
 if(d>new Date(TODAY.y,TODAY.m,TODAY.d))return {ok:false,msg:'Ngày sinh không thể ở tương lai'};if(d<new Date(1940,0,1))return {ok:false,msg:'Hãy nhập năm sinh từ 1940'};return {ok:true,msg:''}}
/* ===== điều khiển ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-x]');if(!t)return;const a=t.dataset.x,d=t.dataset;
 switch(a){
 case 'notif':openNotif();break;
 case 'nopen':{const n=NOTIFS.find(x=>x.id===d.id);if(!n)break;if(n.kind==='req'||n.kind==='inv'){n.read=true;renderNotif();renderAll();break}n.read=true;if(n.go){closePage('pgNotif');renderAll();if(n.go==='mail')openMail();else go(n.go)}else{renderNotif();renderAll()}break}
 case 'nall':NOTIFS.forEach(n=>n.read=true);renderNotif();renderAll();break;
 case 'non':S.priv.notif=true;renderNotif();break;
 case 'nacc':{const n=NOTIFS.find(x=>x.id===d.id);if(n&&n.kind==='req')acceptFriend();else acceptInvite();break}
 case 'ndec':{const i=NOTIFS.findIndex(x=>x.id===d.id);if(i>=0)NOTIFS.splice(i,1);renderNotif();renderAll();toast('Đã từ chối');break}
 case 'cals':calsSheet();break;
 case 'mcal':manageCal(+d.i);break;
 case 'ncal':newCalSheet();break;
 case 'ncok':{const v=$('#ncn').value.trim();if(v.length<2){$('#ncerr').textContent='Tên lịch cần ít nhất 2 ký tự';break}if(CALS.length>=4){toast('Bạn đã đủ 4 lịch');break}
  CALS.push({id:'c'+Date.now(),name:v,members:['me'],owner:'me'});S.calIdx=CALS.length-1;closeSheet();renderAll();toast('Đã tạo lịch “'+v+'”');break}
 case 'cown':transferCal(+d.i,d.m);break;
 case 'crem':removeMember(+d.i,d.m);break;
 case 'cleave':leaveCal(+d.i);break;
 case 'cdel':delCal(+d.i);break;
 case 'cinv':inviteSheet(+d.i);break;
 case 'cinv1':{const f=S.friends.find(x=>x.id===d.id);f._inv=f._inv||{};f._inv[CALS[+d.i].id]=1;inviteSheet(+d.i);toast('Đã gửi lời mời cho '+f.name);break}
 case 'cren':renameSheet(+d.i);break;
 case 'rnok':{const v=$('#rnn').value.trim();if(v.length<2){$('#rnerr').textContent='Tên lịch cần ít nhất 2 ký tự';break}CALS[+d.i].name=v;manageCal(+d.i);renderAll();toast('Đã đổi tên lịch');break}
 case 'cfok':if(CFN)CFN();break;
 case 'cfno':closeSheet();break;
 case 'dup':openDup();break;
 case 'admin':openAdmin();break;
 case 'ato':ADM.to=d.v;renderAdmin();break;
 case 'aua':{const i=$('#aun'),v=i.value.trim().toLowerCase().replace(/^@/,'');if(!/^[a-z0-9_]{4,19}$/.test(v)){toast('Username 4 đến 19 ký tự: chữ thường, số, gạch dưới');break}if(!ADM.users.includes(v))ADM.users.push(v);renderAdmin();break}
 case 'aur':ADM.users.splice(+d.i,1);renderAdmin();break;
 case 'agk':ADM.kind=d.v;renderAdmin();break;
 case 'agr':ADM.rar=d.v;renderAdmin();break;
 case 'ags':ADM.saver=Math.max(1,Math.min(5,ADM.saver+(+d.v)));renderAdmin();break;
 case 'aga':{const k=ADM.kind;const sel=$('#agt');if(sel)ADM.title=sel.value;
  const g=k==='card'?{k:'card',r:ADM.rar}:k==='saver'?{k:'saver',n:ADM.saver}:{k:'title',id:ADM.title};
  if(ADM.gifts.length>=4){toast('Mỗi thư đính kèm tối đa 4 quà');break}const keep={t:($('#att')||{}).value,b:($('#atb')||{}).value};ADM.gifts.push(g);renderAdmin();$('#att').value=keep.t||'';$('#atb').value=keep.b||'';$('#atc').textContent=($('#atb').value.length)+'/600';break}
 case 'agd':{const keep={t:$('#att').value,b:$('#atb').value};ADM.gifts.splice(+d.i,1);renderAdmin();$('#att').value=keep.t;$('#atb').value=keep.b;$('#atc').textContent=keep.b.length+'/600';break}
 case 'asc':{const keep={t:$('#att').value,b:$('#atb').value};ADM.sched=d.v;renderAdmin();$('#att').value=keep.t;$('#atb').value=keep.b;$('#atc').textContent=keep.b.length+'/600';break}
 case 'aprev':adminPreview();break;
 case 'asend':adminSend();break;
 case 'err':errAct(d.v,t);break;
 case 'events':eventsSheet();break;
 case 'setbd':editProfile();break;
 case 'recap':openRecap();break;
 case 'rcshot':shotSheet(recapCanvas(),'colentis-thang-10.png','Ảnh tổng kết tháng 10');break;
 case 'rcshare':{SHOT={};try{const cv=recapCanvas();SHOT={url:cv.toDataURL('image/png'),fname:'colentis-thang-10.png'}}catch(er){}shotShare();break}
 case 'dlcard':cardShot(d.cid);break;
 case 'shshare':shotShare();break;
 case 'fav':favPick(+d.i);break;
 case 'favset':{const i=+d.i,cid=d.cid;S.fav=S.fav.map((x,j)=>j!==i&&x===cid?null:x);S.fav[i]=cid;closeSheet();renderPro();toast('Đã chọn thẻ yêu thích');break}
 case 'favrm':S.fav[+d.i]=null;closeSheet();renderPro();toast('Đã gỡ thẻ');break;
 case 'cheer':cheerSheet(d.id);break;
 case 'cheerok':{S.cheered[d.id]=1;closeSheet();renderToday();toast('Đã gửi: “'+CHEERS[+d.i][0]+'” cho '+MEMBERS[d.id].name);vib(20);sfx('ok');break}
 case 'mlx':$('#mile').classList.remove('on');break;
 case 'mlt':$('#mile').classList.remove('on');go('pro');setTimeout(()=>achSheet('streak-'+d.n),350);break;
 case 'tskip':case 'tfinish':$('#tour').classList.remove('on');break;
 case 'tprev':TOURI=Math.max(0,TOURI-1);renderTour();break;
 case 'tnext':if(TOURI>=TOUR.length-1){$('#tour').classList.remove('on');toast('Chúc bạn một ngày nhiều tick!')}else{TOURI++;renderTour()}break;
 case 'tour':openTour();break;
 case 'admint':openAdmin();break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const t=$('#tour'),m=$('#mile'),er=$('#errv');if(t&&t.classList.contains('on'))t.classList.remove('on');else if(m&&m.classList.contains('on'))m.classList.remove('on')}});
/* bảng demo thêm */
$$('[data-d2]').forEach(b=>b.onclick=()=>{const k=b.dataset.d2,v=b.dataset.v;$('#panel')&&$('#panel').classList.remove('open');
 if(k==='notif')openNotif();
 else if(k==='cals'){go('fr');calsSheet()}
 else if(k==='closed'){S.regClosed=true;INTRO.mode='reg';runIntro('auth')}
 else if(k==='open'){S.regClosed=false;toast('Đã mở lại đăng ký')}
 else if(k==='forgot'){INTRO.mode='login';runIntro('auth');setTimeout(()=>forgotFlow(1),400)}
 else if(k==='err')showErr(v);
 else if(k==='dup'){go('col');openDup()}
 else if(k==='admin')openAdmin();
 else if(k==='recap')openRecap();
 else if(k==='tour')openTour();
 else if(k==='mile')showMile(+v);
 else if(k==='events')eventsSheet();
 else if(k==='fav'){go('pro');setTimeout(()=>favPick(1),250)}
 else if(k==='regbd'){INTRO.mode='reg';runIntro('auth')}});

/* ===== mặt sau thẻ theo độ hiếm ===== */
function backHTML(c,o){const w=o.w;let cls;
 if(c.r==='event')cls='pb-e pbe-'+c.tier;else if(c.r==='supreme')cls='pb-s pbs'+(String(c.fx).replace('s','')||1);else cls='pb-'+({legend:'l',rare:'r'}[c.r]||'c');
 const st=o.fill?`width:100%;height:100%;aspect-ratio:auto;--w:${w}px`:`--w:${w}px;--ar:${o.ar};width:${w}px;aspect-ratio:${o.ar}`;
 const inner=c.r==='event'?`<svg class="pbk" viewBox="0 0 96 108"><use href="#cake"/></svg><b class="pbt">${c.tier}</b>`:'';
 const sp=c.r==='common'||c.r==='rare'?'':'<u></u><u></u><u></u><u></u><u></u><u></u>';
 return `<div class="pb ${cls}" style="${st}"><span class="pbx"></span><span class="pby"></span>${sp}${inner}<i></i></div>`}
/* ===== khởi động (chạy sau cùng) ===== */
renderAll();skeleton(650);
grantWelcome();syncBadges&&syncBadges();renderAll();
runIntro('splash');
</script></body></html>
